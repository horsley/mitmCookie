<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITM Proxy Manager</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            margin-top: 0;
            color: var(--text-main);
        }

        .container {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .sidebar {
            width: 180px;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .nav-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            margin-bottom: 0.25rem;
            transition: all 0.15s;
        }

        .nav-item:hover {
            background: var(--bg);
            color: var(--text-main);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .main {
            flex: 1;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            display: none;
        }

        .main.active {
            display: block;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            transition: border-color 0.15s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            border-radius: 0.375rem;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.danger-btn {
            background: var(--danger);
        }

        button.danger-btn:hover {
            background: var(--danger-hover);
        }

        button.success-btn {
            background: var(--success);
        }

        button.success-btn:hover {
            background: var(--success-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .domain-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 0 0;
        }

        .domain-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .domain-list li:last-child {
            border-bottom: none;
        }

        .delete-btn-sm {
            background: transparent;
            color: var(--text-muted);
            width: auto;
            padding: 0 0.25rem;
            font-size: 1.25rem;
            line-height: 1;
            margin-left: 2px;
        }

        .delete-btn-sm:hover {
            color: var(--danger);
            background: transparent;
            transform: none;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 1rem;
        }

        tbody.cookie-group {
            display: table-row-group;
        }

        tbody.cookie-group::before {
            content: '';
            display: block;
            height: 1rem;
        }

        tbody.cookie-group:first-child::before {
            height: 0;
        }

        .meta-row td {
            background: #f1f5f9;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
            border: 1px solid var(--border);
            border-bottom: none;
        }

        .meta-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta-info {
            display: flex;
            gap: 2rem;
        }

        .meta-actions button {
            width: auto;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
        }

        .kv-row td {
            border: 1px solid var(--border);
            border-top: none;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            vertical-align: top;
            background: white;
            word-break: break-all;
        }

        .kv-row:last-child td {
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
        }

        .name-col {
            width: 180px;
            min-width: 120px;
            font-weight: 600;
            color: var(--text-muted);
            background: #fcfcfc !important;
        }

        .value-col {
            font-family: 'Monaco', 'Consolas', monospace;
            color: #334155;
            font-size: 0.8rem;
        }

        /* Addons styles */
        .addon-card {
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--bg);
        }

        .addon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .addon-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .addon-version {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 0.5rem;
        }

        .addon-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .addon-config {
            background: white;
            padding: 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid var(--border);
            margin-top: 0.75rem;
        }

        .addon-config label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .addon-config input[type="text"] {
            margin-bottom: 0.5rem;
        }

        /* Toggle switch */
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: 0.2s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--primary);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .badge.enabled {
            background: #d1fae5;
            color: #065f46;
        }

        .badge.disabled {
            background: #f1f5f9;
            color: #64748b;
        }

        .reload-note {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 0.375rem;
            padding: 0.75rem;
            font-size: 0.8rem;
            color: #92400e;
            margin-bottom: 1rem;
        }

        .onboarding-note {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            color: #1e3a8a;
        }

        .onboarding-note strong {
            color: #1e40af;
        }

        .onboarding-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: #1d4ed8;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }

        .onboarding-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>MITM Proxy Manager</h1>

    <div class="onboarding-note">
        <strong>Install Root Certificate</strong><br>
        Open the onboarding page using <strong>HTTP</strong> (not HTTPS):<br>
        <a class="onboarding-link" href="{{ onboarding_url }}" target="_blank">{{ onboarding_url }}</a><br>
        Current onboarding host: <code>{{ onboarding_host }}</code>
    </div>

    <div class="container">
        <div class="sidebar">
            <button class="nav-item active" onclick="showTab('cookies')">🍪 Cookies</button>
            <button class="nav-item" onclick="showTab('domains')">📡 Domains</button>
            <button class="nav-item" onclick="showTab('auth')">🔐 Auth</button>
            <button class="nav-item" onclick="showTab('addons')">🧩 Addons</button>
        </div>

        <!-- Cookies Tab -->
        <div class="main active" id="tab-cookies">
            <h3>Captured Cookies</h3>
            <div class="action-bar">
                <button onclick="loadCookies()" style="background: #10b981;">
                    Refresh List
                </button>
                <button onclick="clearAllCookies()" class="danger-btn">
                    Clear All
                </button>
            </div>
            <table id="cookieTable"></table>
        </div>

        <!-- Domains Tab -->
        <div class="main" id="tab-domains">
            <h3>Watchlist</h3>
            <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
                <input type="text" id="domainInput" placeholder="e.g. example.com" style="max-width:300px;">
                <button onclick="addDomain()">Add Domain</button>
            </div>
            <ul class="domain-list" id="domainList"></ul>
        </div>

        <!-- Auth Tab -->
        <div class="main" id="tab-auth">
            <h3>Proxy Authentication</h3>
            <div style="max-width: 400px;">
                <label style="font-size: 0.85rem; color: var(--text-muted);">Username</label>
                <input type="text" id="proxyUser" placeholder="Enter username">
                
                <label style="font-size: 0.85rem; color: var(--text-muted);">Password</label>
                <input type="password" id="proxyPass" placeholder="Enter password">
                
                <button onclick="saveConfig()" style="margin-top: 0.5rem;">Save Credentials</button>
                <div id="configMsg" style="margin-top:0.5rem; font-size:0.75rem; color: #10b981; min-height: 1.25em;"></div>
            </div>
        </div>

        <!-- Addons Tab -->
        <div class="main" id="tab-addons">
            <h3>Plugin Management</h3>
            <div class="reload-note">
                ⚠️ Changes require proxy restart to take effect.
            </div>
            <div id="addonList"></div>
        </div>
    </div>

    <script>
        // Init
        loadDomains();
        loadCookies();
        loadConfig();
        loadAddons();

        // Auto-refresh cookies every 3 seconds
        setInterval(loadCookies, 3000);

        function showTab(tab) {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.main').forEach(m => m.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        async function loadDomains() {
            const res = await fetch('/api/domains');
            const data = await res.json();
            const list = document.getElementById('domainList');
            list.innerHTML = '';
            data.domains.forEach(d => {
                const li = document.createElement('li');
                li.innerHTML = `<span title="${d}">${d}</span> <button class="delete-btn-sm" onclick="deleteDomain('${d}')">&times;</button>`;
                list.appendChild(li);
            });
        }

        async function addDomain() {
            const input = document.getElementById('domainInput');
            const domain = input.value.trim();
            if (!domain) return;
            await fetch('/api/domains', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ domain })
            });
            input.value = '';
            loadDomains();
        }

        async function deleteDomain(domain) {
            await fetch(`/api/domains/${domain}`, { method: 'DELETE' });
            loadDomains();
        }

        async function loadConfig() {
            const res = await fetch('/api/config');
            const data = await res.json();
            if (data.proxy_username) {
                document.getElementById('proxyUser').value = data.proxy_username;
            }
            if (data.proxy_password_set) {
                document.getElementById('proxyPass').placeholder = "••••••";
            }
        }

        async function saveConfig() {
            const username = document.getElementById('proxyUser').value.trim();
            const password = document.getElementById('proxyPass').value.trim();

            if (!username || (!password && document.getElementById('proxyPass').placeholder !== "••••••")) {
                alert("Please enter both username and password");
                return;
            }

            const body = { username };
            if (password) body.password = password;

            await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const msg = document.getElementById('configMsg');
            msg.innerText = "Credentials saved securely.";
            setTimeout(() => msg.innerText = "", 3000);
            loadConfig();
        }

        // ========== Cookies ==========
        
        let lastCookieData = "";

        async function loadCookies() {
            const res = await fetch('/api/cookies');
            const data = await res.json();

            const currentDataStr = JSON.stringify(data.cookies);
            if (currentDataStr === lastCookieData) return;

            const selection = document.getSelection();
            if (selection && selection.type === 'Range' && !selection.isCollapsed) {
                return;
            }

            lastCookieData = currentDataStr;

            const table = document.getElementById('cookieTable');
            table.innerHTML = '';

            if (data.cookies.length === 0) {
                table.innerHTML = '<tr><td style="text-align:center; padding: 2rem; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 0.5rem;">No cookies captured yet. Add a domain to the watchlist and visit it.</td></tr>';
                return;
            }

            data.cookies.forEach(c => {
                let timeStr = c.last_updated;
                if (timeStr.includes('.')) {
                    timeStr = timeStr.split('.')[0];
                }

                let raw = c.full_cookie_header;
                let parts = raw.split(/[;,]\s*/).filter(s => s.trim().length > 0);

                if (parts.length === 0) {
                    parts = ["(empty)="];
                }

                const pairs = parts.map(p => {
                    const idx = p.indexOf('=');
                    if (idx === -1) return { k: p, v: "" };
                    return { k: p.substring(0, idx), v: p.substring(idx + 1) };
                });

                const tbody = document.createElement('tbody');
                tbody.className = 'cookie-group';

                const metaRow = document.createElement('tr');
                metaRow.className = 'meta-row';
                metaRow.innerHTML = `
                    <td colspan="2">
                        <div class="meta-content">
                            <div class="meta-info">
                                <span>${timeStr}</span>
                                <span>${escapeHtml(c.domain)}</span>
                            </div>
                            <div class="meta-actions">
                                <button class="danger-btn" onclick="deleteCookie(${c.id})">Delete</button>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(metaRow);

                pairs.forEach(pair => {
                    const tr = document.createElement('tr');
                    tr.className = 'kv-row';
                    tr.innerHTML = `
                        <td class="name-col">${escapeHtml(pair.k)}</td>
                        <td class="value-col">${escapeHtml(pair.v)}</td>
                    `;
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
            });
        }

        async function deleteCookie(id) {
            if (!confirm("Delete this cookie record?")) return;
            await fetch(`/api/cookies/${id}`, { method: 'DELETE' });
            loadCookies();
        }

        async function clearAllCookies() {
            if (!confirm("⚠️ Delete ALL captured cookies?")) return;
            await fetch('/api/cookies', { method: 'DELETE' });
            loadCookies();
        }

        // ========== Addons ==========

        async function loadAddons() {
            const res = await fetch('/api/addons');
            const data = await res.json();
            
            const container = document.getElementById('addonList');
            container.innerHTML = '';

            data.addons.forEach(addon => {
                const card = document.createElement('div');
                card.className = 'addon-card';
                
                const isEnabled = addon.enabled;
                const badgeClass = isEnabled ? 'enabled' : 'disabled';
                const badgeText = isEnabled ? 'Enabled' : 'Disabled';
                
                let configHtml = '';
                
                // Generate config inputs based on addon type
                if (addon.name === 'eruda_inject') {
                    const domains = addon.config.domains || [];
                    const domainsStr = domains.join(', ');
                    configHtml = `
                        <div class="addon-config">
                            <label>Allowed Domains (comma-separated, empty = all)</label>
                            <input type="text" id="addon-config-${addon.name}" value="${escapeHtml(domainsStr)}" placeholder="example.com, test.com">
                            <button onclick="saveAddonConfig('${addon.name}')">Save Config</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="addon-header">
                        <div>
                            <span class="addon-name">${addon.name}</span>
                            <span class="addon-version">v${addon.version}</span>
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleAddon('${addon.name}', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="addon-desc">${addon.description}</div>
                    ${configHtml}
                `;
                
                container.appendChild(card);
            });
        }

        async function toggleAddon(name, enabled) {
            // Get current config
            const res = await fetch('/api/addons');
            const data = await res.json();
            const addon = data.addons.find(a => a.name === name);
            const config = addon ? addon.config : {};
            
            await fetch(`/api/addons/${name}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled, config })
            });
            
            loadAddons();
        }

        async function saveAddonConfig(name) {
            const input = document.getElementById(`addon-config-${name}`);
            const domainsStr = input.value.trim();
            const domains = domainsStr ? domainsStr.split(',').map(d => d.trim()).filter(d => d) : [];
            
            // Get current enabled state
            const res = await fetch('/api/addons');
            const data = await res.json();
            const addon = data.addons.find(a => a.name === name);
            const enabled = addon ? addon.enabled : false;
            
            await fetch(`/api/addons/${name}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    enabled,
                    config: { domains }
                })
            });
            
            alert('Config saved! Restart proxy to apply changes.');
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>

</html>
